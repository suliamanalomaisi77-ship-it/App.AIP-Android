name: AIP Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o AIP_Flutter_Android_Build_Kit.zip -d .
          ls -la AIP_Flutter_Project

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        working-directory: AIP_Flutter_Project
        run: flutter create --platforms=android --org com.aipcreative --project-name aip_app .

      - name: Install dependencies
        working-directory: AIP_Flutter_Project
        run: flutter pub get

      - name: Build APK
        working-directory: AIP_Flutter_Project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIP-Android-APK
          path: AIP_Flutter_Project/build/app/outputs/flutter-apk/app-release.apk
